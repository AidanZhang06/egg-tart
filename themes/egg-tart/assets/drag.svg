<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -34 60 60" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      .lift { transform: translateY(-2px); }
      .sway { transform-origin: 10px 5px; animation: sway 1.2s infinite alternate ease-in-out; }
      .sag { transform-origin: 10px 5px; animation: sag 0.6s infinite alternate ease-in-out; }
      .shadow { transform-origin: 10px 20px; animation: shadow-lift 1.2s infinite alternate ease-in-out; }
      .flail-l { animation: flail-l 0.3s infinite alternate ease-in-out; }
      .flail-r { animation: flail-r 0.3s infinite alternate ease-in-out; }
      @keyframes sway { 0% { transform: rotate(-8deg) translate(-1px, 0); } 100% { transform: rotate(8deg) translate(1px, 0); } }
      @keyframes sag { 0% { transform: scale(0.96, 1.05); } 100% { transform: scale(0.94, 1.09); } }
      @keyframes shadow-lift { 0% { transform: translateX(-1px) scaleX(0.7); opacity: 0.2; } 100% { transform: translateX(1px) scaleX(0.75); opacity: 0.3; } }
      @keyframes flail-l { 0% { transform: rotate(30deg); } 100% { transform: rotate(75deg); } }
      @keyframes flail-r { 0% { transform: rotate(-30deg); } 100% { transform: rotate(-75deg); } }
      
      .arm-l { transform-box: fill-box; transform-origin: 100% 50%; }
      .arm-r { transform-box: fill-box; transform-origin: 0% 50%; }
    </style>
  </defs>
  <g class="shadow"><rect x="3" y="20" width="14" height="1" fill="#000" opacity="0.5"/></g>

      #shadow-js { transform-origin: 10px 20px; }
      
      @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, 0.97); } }
      .blink { transform-origin: 10px 11.35px; animation: blink 4s infinite ease-in-out; }
